# Render Blueprint: one service, auto-deploys on every git push.
# SQLite database + uploaded images live on a persistent disk at /var/data.
# Persistent disks need a paid instance type (Render's default paid plan is used below).
services:
  - type: web
    name: vmgt-bookings
    runtime: docker
    plan: starter                # Persistent disk requires Starter plan ($7/mo)
    dockerfilePath: ./Dockerfile
    region: frankfurt            # closest Render region to Nigeria
    autoDeployTrigger: commit    # redeploy automatically on every push
    healthCheckPath: /healthz.php
    disk:
      name: vmgt-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_DRIVER
        value: sqlite
      - key: DATA_DIR
        value: /var/data
      - key: APP_SECRET
        generateValue: true
      # First admin login (created only if no admin exists yet).
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true      # read it in Dashboard > Environment, then change it in /admin/profile.php
      # Prompted once when you create the Blueprint:
      - key: SITE_URL
        sync: false              # e.g. https://vmgtbookings.com (or your onrender.com URL)
      - key: ADMIN_EMAIL
        sync: false              # where booking / contact notifications are sent
      # Optional SMTP (Render blocks PHP mail()). Leave blank to skip email.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
